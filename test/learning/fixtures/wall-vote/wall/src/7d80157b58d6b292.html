<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <title>Hydra Visual Synthesizer</title>
    <script data-vendor="vendor/hydra-synth/1.3.10/hydra-synth.js"></script>
    <style>
        body {
            margin: 0;
            background: #000;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            width: 100vw;
            height: 100vh;
            display: block;
            object-fit: cover;
        }
        #error {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff4444;
            font-family: monospace;
            background: rgba(0,0,0,0.9);
            padding: 20px;
            border-radius: 8px;
            display: none;
            max-width: 80%;
        }
    </style>
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' 'unsafe-inline' 'unsafe-eval' blob:; worker-src blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self';">
</head>
<body>
    <canvas id="hydra-canvas"></canvas>
    <div id="error"></div>
    <script>
        const canvas = document.getElementById('hydra-canvas');
        const errorDiv = document.getElementById('error');

        try {
            const hydraWidth = window.innerWidth || 1280;
            const hydraHeight = window.innerHeight || 800;
            canvas.width = hydraWidth;
            canvas.height = hydraHeight;

            // Signal that hydra is initialized and ready to render.
            window.__hydraReady = true;
            window.__hydraWidth = hydraWidth;
            window.__hydraHeight = hydraHeight;

            const hydra = new Hydra({
                canvas: canvas,
                detectAudio: false,
                enableStreamCapture: false,
                width: hydraWidth,
                height: hydraHeight
            });

            // Expose hydra globally so waitForFirstFrame can read pixel data.
            window.hydra = hydra;

            // Call setResolution synchronously after construction so all
            // internal buffers are allocated at the correct size.
            if (typeof setResolution === 'function') {
                setResolution(hydraWidth, hydraHeight);
            }

            window.addEventListener('resize', () => {
                const nextWidth = window.innerWidth || 1280;
                const nextHeight = window.innerHeight || 800;
                canvas.width = nextWidth;
                canvas.height = nextHeight;
                window.__hydraWidth = nextWidth;
                window.__hydraHeight = nextHeight;
                if (typeof setResolution === 'function') setResolution(nextWidth, nextHeight);
            });
            const go = () => {}; const o = typeof o0 !== 'undefined' ? o0 : undefined;

            osc(3,0.02,0.9).rotate(()=>time*0.15).scale(()=>1.6+Math.sin(time/5)*0.4).color(1.2,0.3,1.4).blend(noise(2,0.1).rotate(()=>-time*0.08).scale(1.3).color(0.4,1.1,1.5),0.5).modulate(osc(6,0.05,0.5).rotate(()=>time*0.3),0.05).repeat(()=>3+Math.sin(time/7)*2,()=>3+Math.cos(time/9)*2).kaleid(4).scale(()=>1.0+Math.sin(time/3)*0.15).mult(shape(4,0.4,0.02).scale(()=>1.1+Math.sin(time/6)*0.2).color(0.8,0.9,1.2),0.4).add(osc(20,0.1,0.3).rotate(()=>time*0.5).scale(1.8).color(1.5,0.2,1.2).mult(shape(2,0.6,0.1).repeat(1,20).modulate(noise(1,0.2),0.02),0.3)).out()

        } catch (err) {
            console.error('Hydra error:', err);
            errorDiv.style.display = 'block';
            errorDiv.innerHTML = '<strong>Hydra Error:</strong><br>' + err.message;
        }
    </script>
</body>
</html>
